<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账号解析器</title>
<meta name="description" content="本地解析工作台导出的「账号 + AT」或「邮箱凭证 + AT」文本。全部在浏览器本地完成，不上传任何数据。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
<style>
:root{
  --bg:#f6f8fa; --card:#ffffff; --line:#d8dee4; --line-soft:#eaeef2;
  --text:#1f2328; --muted:#656d76; --accent:#0969da; --accent-hover:#0860c4;
  --ok:#1a7f37; --ok-bg:#dafbe1; --warn:#9a6700; --warn-bg:#fff8c5;
  --danger:#cf222e; --danger-bg:#ffebe9; --code-bg:#eff1f3;
  --radius:10px;
  --font-ui:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif;
  --font-mono:"Cascadia Mono","Sarasa Mono SC","Microsoft YaHei UI",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1117; --card:#161b22; --line:#30363d; --line-soft:#21262d;
    --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7; --accent-hover:#4b94f9;
    --ok:#3fb950; --ok-bg:#12261a; --warn:#d29922; --warn-bg:#2b2413;
    --danger:#f85149; --danger-bg:#2d1416; --code-bg:#1f242c;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-ui); font-size:15px; line-height:1.65;
  font-synthesis:none;
}
.wrap{max-width:880px;margin:0 auto;padding:40px 18px 80px}
header h1{font-family:var(--font-ui);font-size:clamp(1.65rem,4vw,2.1rem);font-weight:800;margin:0 0 8px;letter-spacing:.01em}
code{
  background:var(--code-bg);border-radius:5px;padding:1px 5px;
  font-family:var(--font-mono);
  font-size:.88em;
}
.privacy{
  margin:20px 0 22px;padding:12px 15px;border-radius:var(--radius);
  background:var(--ok-bg);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);
  color:var(--text);font-size:.9rem;
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;margin-bottom:16px;
}
.card h2{
  font-family:var(--font-ui);font-size:1.05rem;margin:0 0 14px;display:flex;align-items:center;gap:9px;font-weight:700;
}
.step{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:.78rem;font-weight:700;flex:none;
}
.input-box{border:1.5px dashed var(--line);border-radius:var(--radius);overflow:hidden;transition:border-color .15s,background .15s}
.input-box.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.input-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;color:var(--muted);font-size:.88rem}
.input-toolbar p{margin:0}
textarea{
  display:block;width:100%;min-height:170px;resize:vertical;padding:12px;
  border:0;border-top:1px solid var(--line-soft);border-radius:0;
  background:var(--bg);color:var(--text);
  font-family:var(--font-mono);font-size:13px;line-height:1.65;outline:none;
}
textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 28%,transparent);outline-offset:-2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.row-right{display:flex;gap:8px}
.stat{color:var(--muted);font-size:.86rem}
button{
  font:inherit;font-size:.88rem;border-radius:7px;padding:8px 14px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--text);
  transition:background .15s,border-color .15s,opacity .15s;
}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button.primary:disabled{opacity:.5;cursor:not-allowed}
button.link{
  border:none;background:none;color:var(--accent);padding:0;text-decoration:underline;
  font-size:inherit;cursor:pointer;
}
button.wide{width:100%;padding:11px 14px;font-size:.95rem}
.format-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 14px}
.format-option{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;cursor:pointer;color:var(--text)}
.format-option:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.format-option input{margin:4px 0 0;flex:none}
.format-option > span{display:block;font-family:var(--font-ui);font-size:.96rem;line-height:1.45;font-weight:700;overflow-wrap:anywhere}
.metrics{display:flex;align-items:center;gap:22px;padding:0 0 14px;margin-bottom:14px;border-bottom:1px solid var(--line-soft)}
.metric{display:flex;align-items:baseline;gap:6px}
.metric b{font-size:1.45rem;line-height:1.1}
.metric span{font-size:.85rem;color:var(--muted)}
.metric.ok b{color:var(--ok)}
.metric.warn b{color:var(--warn)}
.metric.bad b{color:var(--danger)}
.downloads{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dl{border:1px solid var(--line-soft);border-radius:var(--radius);padding:15px}
.bad-dl{grid-column:1/-1;border-color:color-mix(in srgb,var(--danger) 35%,var(--line));background:color-mix(in srgb,var(--danger) 4%,transparent)}
.dl-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.dl-title{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.03em}
.dl-body{
  margin-top:5px;font-family:var(--font-mono);font-size:11.5px;
  background:var(--code-bg);border-radius:6px;padding:7px 9px;
  overflow-x:auto;white-space:nowrap;color:var(--text);
}
.dl-count{flex:none;color:var(--accent);font-size:.82rem;font-weight:700;white-space:nowrap;padding-top:1px}
.dl-actions{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px}
.bad-dl .dl-actions{grid-template-columns:1fr}
.dl-actions button{width:100%;min-width:0}
details{margin-top:18px;border-top:1px solid var(--line-soft);padding-top:14px}
summary{cursor:pointer;font-size:.9rem;color:var(--muted);font-weight:600}
summary:hover{color:var(--text)}
.issues{margin-top:12px;font-size:.86rem}
.issues li{margin-bottom:5px;color:var(--danger)}
.issues code{color:inherit}
.tip{margin-top:16px;font-size:.85rem;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
.format-alert{margin:0 0 14px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--danger) 60%,var(--line));border-radius:var(--radius);background:var(--danger-bg);color:var(--danger);font-size:.9rem;line-height:1.55}
.format-alert strong{display:block;margin-bottom:2px;font-weight:700}
@media (max-width:640px){
  .wrap{padding:26px 13px 60px}
  .card{padding:16px}
  .downloads{grid-template-columns:1fr}
  .metrics{gap:16px}
  .metric b{font-size:1.25rem}
  .format-options{grid-template-columns:1fr}
  .dl-actions{grid-template-columns:minmax(0,1fr) 82px}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>账号解析器</h1>
  </header>

  <div class="privacy">
    🔒 所有内容都只在<strong>你自己的浏览器</strong>里处理，不会上传到任何服务器，可以断网使用。
  </div>

  <section class="card">
    <h2><span class="step">1</span>输入账号文本</h2>
    <div class="format-options" role="radiogroup" aria-label="输入格式">
      <label class="format-option">
        <input type="radio" name="format" value="account" checked>
        <span>邮箱----密码----2FA密钥----AT</span>
      </label>
      <label class="format-option">
        <input type="radio" name="format" value="mailbox">
        <span>完整邮箱凭证----AT</span>
      </label>
    </div>
    <p class="hint" id="formatHint">账号模式会输出「邮箱----密码----2FA密钥」与 AT 两个文件。</p>
    <div class="input-box" id="inputBox">
      <div class="input-toolbar">
        <p>直接粘贴账号文本，或将 txt 文件拖入此区域</p>
        <button class="link" id="pick" type="button">选择文件</button>
      </div>
      <input type="file" id="file" accept=".txt,.csv,text/plain" hidden>
      <textarea id="input" spellcheck="false" autocomplete="off"
        placeholder="每行一条：邮箱----密码----2FA密钥----AT"></textarea>
    </div>
    <div class="row">
      <span class="stat" id="inputStat">0 行</span>
      <div class="row-right">
        <button type="button" id="clear">清空</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2><span class="step">2</span>开始解析</h2>
    <div class="format-alert" id="formatAlert" role="alert" hidden>
      <strong id="formatAlertTitle">格式选择错误</strong>
      <span id="formatAlertText"></span>
    </div>
    <button class="primary wide" id="run" type="button">开始解析</button>
  </section>

  <section class="card" id="resultCard" hidden>
    <h2><span class="step">3</span>下载结果</h2>

    <div class="metrics">
      <div class="metric ok"><b id="mOk">0</b><span>解析成功</span></div>
      <div class="metric bad"><b id="mBad">0</b><span>无法解析</span></div>
    </div>

    <div class="downloads">
      <div class="dl">
        <div class="dl-top">
          <div>
            <div class="dl-title">文件 1</div>
            <div class="dl-body" id="fileAFormat">邮箱----密码----2FA密钥</div>
          </div>
          <div class="dl-count" id="c1">0 条</div>
        </div>
        <div class="dl-actions">
          <button class="primary" id="dl1" type="button">下载 邮箱-密码-2FA.txt</button>
          <button id="cp1" type="button">复制</button>
        </div>
      </div>
      <div class="dl">
        <div class="dl-top">
          <div>
            <div class="dl-title">文件 2</div>
            <div class="dl-body">AT（访问令牌）</div>
          </div>
          <div class="dl-count" id="c2">0 条</div>
        </div>
        <div class="dl-actions">
          <button class="primary" id="dl2" type="button">下载 AT.txt</button>
          <button id="cp2" type="button">复制</button>
        </div>
      </div>
      <div class="dl bad-dl" id="badDownload" hidden>
        <div class="dl-top">
          <div>
            <div class="dl-title">解析失败原始行</div>
            <div class="dl-body">原始内容，一行一条（不含错误说明）</div>
          </div>
          <div class="dl-count" id="cBad">0 条</div>
        </div>
        <div class="dl-actions">
          <button class="primary" id="dlBad" type="button">下载失败原始行.txt</button>
        </div>
      </div>
    </div>

    <div class="tip">
      两个文件的行是<strong>一一对应</strong>的：文件 1 的第 1 行，对应文件 2 的第 1 行。可以分开使用。
    </div>

    <details id="issueBox" hidden>
      <summary id="issueSummary">无法解析的行</summary>
      <ul class="issues" id="issues"></ul>
    </details>
  </section>

</div>

<script>
/* ==== PARSE-CORE-START ==== */
/* 以下是纯函数解析核心，不依赖浏览器 API，可被测试脚本单独抽出运行。 */

var SEP = '----';

/** 去掉 UTF-8 BOM */
function stripBom(text) {
  return text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text;
}

/**
 * 从一行末尾剥离工作台导出的 JWT AT。AT 前必须有分隔符，
 * 且 AT 需以 eyJ 开头、由 3 段组成，避免把 2FA 密钥误判为 AT。
 * @returns {{before?:string, at?:string, reason?:string}}
 */
function splitAtTail(s) {
  var m = s.match(/^(.*)----(eyJ[A-Za-z0-9_\-]*\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+)$/);
  if (m) return { before: m[1], at: m[2] };
  if (/eyJ[A-Za-z0-9_\-]*\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+$/.test(s)) {
    return { reason: 'AT 前缺少分隔符 ' + SEP };
  }

  var li = s.lastIndexOf(SEP);
  if (li < 0) return { reason: '找不到「' + SEP + 'AT」分隔符' };
  var tail = s.slice(li + SEP.length).trim();
  if (!tail) return { reason: 'AT 段为空' };
  if (/^[A-Z2-7]{16,64}$/.test(tail)) return { reason: '缺少 AT：末尾是 2FA 密钥' };
  return { reason: 'AT 格式不正确（工作台导出的 AT 应以 eyJ 开头，且包含 3 段）' };
}

function hasEmail(value) {
  return String(value || '').trim().indexOf('@') >= 0;
}

function isTotpSecret(value) {
  return /^[A-Z2-7]{16,64}$/.test(String(value || '').trim());
}

function isUuid(value) {
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(value || '').trim());
}

/* 工作台「免密 AT」导出：邮箱----邮箱密码----client_id(UUID)----RT----AT。
 * 以 UUID client_id 作为高置信度特征，避免把密码中正常出现的分隔符误判为邮箱凭证。 */
function looksLikeWorkbenchMailboxCredential(value) {
  var parts = String(value || '').split(SEP);
  return parts.length >= 4
    && hasEmail(parts[0])
    && Boolean(String(parts[1] || '').trim())
    && isUuid(parts[2])
    && Boolean(parts.slice(3).join(SEP).trim());
}

function looksLikeAccountCredential(value) {
  var parts = String(value || '').split(SEP);
  return (parts.length === 2 && hasEmail(parts[0]) && Boolean(String(parts[1] || '').trim()))
    || (parts.length === 3 && hasEmail(parts[0]) && Boolean(String(parts[1] || '').trim()) && isTotpSecret(parts[2]));
}

/**
 * 解析单行账号：邮箱----密码----2FA----AT
 * 策略：从右往左剥离（AT → 2FA → 邮箱/密码），
 * 这样即使密码里含连字符（历史遗留数据），也不会切错位。
 * @returns {{status:'ok'|'skip'|'bad', email?:string, password?:string, totp?:string, at?:string, reason?:string}}
 */
function parseAccountLine(raw) {
  var s = String(raw).trim();
  if (!s) return { status: 'skip', reason: '空行' };
  if (s.charAt(0) === '#' || s.charAt(0) === '/') return { status: 'skip', reason: '注释行' };
  /* 注意：除空行与注释外，一律不静默忽略 —— 解析不了就如实报错，
     宁可让用户看到「第 N 行有问题」，也不能悄悄丢数据。 */

  var tail = splitAtTail(s);
  if (tail.reason) return { status: 'bad', reason: tail.reason };
  var at = tail.at, rest = tail.before, m;

  if (looksLikeWorkbenchMailboxCredential(rest)) {
    return { status: 'bad', reason: '检测到完整邮箱凭证，请选择「完整邮箱凭证----AT」格式', expectedFormat: 'mailbox' };
  }

  /* 2. 从行尾剥 2FA：要求前面紧邻分隔符，避免误伤密码 */
  var totp = '';
  m = rest.match(/^(.*)----([A-Z2-7]{16,64})$/);
  if (m) {
    rest = m[1];
    totp = m[2];
  }

  /* 3. 剩下的按「第一个」分隔符切邮箱 / 密码 */
  var i = rest.indexOf(SEP);
  if (i < 0) return { status: 'bad', reason: '缺少「邮箱' + SEP + '密码」分隔符', at: at };
  var email = rest.slice(0, i).trim();
  var password = rest.slice(i + SEP.length);

  if (!email) return { status: 'bad', reason: '邮箱段为空', at: at };
  if (!hasEmail(email)) return { status: 'bad', reason: '邮箱格式不对（缺少 @）', at: at };
  if (!password) return { status: 'bad', reason: '密码段为空', at: at };
  if (!at) return { status: 'bad', reason: 'AT 段为空' };

  return { status: 'ok', email: email, password: password, totp: totp, at: at };
}

/**
 * 解析工作台邮箱凭证：完整邮箱凭证----AT。
 * 邮箱凭证内部可含多个分隔符（refresh_token 也可能含分隔符），因此不重组、原样保留。
 */
function parseMailboxCredentialLine(raw) {
  var s = String(raw).trim();
  if (!s) return { status: 'skip', reason: '空行' };
  if (s.charAt(0) === '#' || s.charAt(0) === '/') return { status: 'skip', reason: '注释行' };

  var tail = splitAtTail(s);
  if (tail.reason) return { status: 'bad', reason: tail.reason };
  var credential = tail.before;
  if (looksLikeAccountCredential(credential)) {
    return { status: 'bad', reason: '检测到账密格式，请选择「邮箱----密码----2FA密钥----AT」格式', expectedFormat: 'account' };
  }
  var parts = credential.split(SEP);
  var email = String(parts[0] || '').trim();
  if (parts.length < 4) return { status: 'bad', reason: '邮箱凭证至少应包含 4 段', at: tail.at };
  if (!email) return { status: 'bad', reason: '邮箱段为空', at: tail.at };
  if (!hasEmail(email)) return { status: 'bad', reason: '邮箱格式不对（缺少 @）', at: tail.at };
  if (!String(parts[2] || '').trim()) return { status: 'bad', reason: '邮箱凭证缺少 client_id', at: tail.at };
  if (!parts.slice(3).join(SEP).trim()) return { status: 'bad', reason: '邮箱凭证缺少 refresh_token', at: tail.at };
  return { status: 'ok', email: email, credential: credential, at: tail.at };
}

/** 向后兼容的统一入口；缺省仍按原账号格式解析。 */
function parseLine(raw, format) {
  return format === 'mailbox' ? parseMailboxCredentialLine(raw) : parseAccountLine(raw);
}

/**
 * 解析整段文本。
 * @param {string} text
 * @param {'account'|'mailbox'} format 输入格式；缺省为账号格式
 */
function splitAccounts(text, format) {
  var mode = format === 'mailbox' ? 'mailbox' : 'account';
  var lines = stripBom(String(text)).split(/\r\n|\r|\n/);
  while (lines.length > 1 && !lines[lines.length - 1].trim()) lines.pop();
  var rows = [], okCount = 0, skipCount = 0, badCount = 0;
  var outA = [], outB = [], outBad = [], issues = [], formatMismatches = [];

  for (var n = 0; n < lines.length; n++) {
    var r = parseLine(lines[n], mode);
    r.lineNo = n + 1;
    r.raw = lines[n];

    if (r.status === 'ok') {
      okCount++;
      var a = mode === 'mailbox'
        ? r.credential
        : r.email + SEP + r.password + (r.totp ? SEP + r.totp : '');
      outA.push(a);
      outB.push(r.at);
    } else if (r.status === 'skip') {
      skipCount++;
    } else {
      badCount++;
      var issue = { lineNo: n + 1, reason: r.reason, raw: lines[n], expectedFormat: r.expectedFormat || '' };
      issues.push(issue);
      if (issue.expectedFormat) formatMismatches.push(issue);
      outBad.push(lines[n]);
    }
    rows.push(r);
  }

  return {
    format: mode,
    rows: rows,
    issues: issues,
    formatMismatches: formatMismatches,
    okCount: okCount,
    skipCount: skipCount,
    badCount: badCount,
    fileA: outA.join('\r\n') + (outA.length ? '\r\n' : ''),
    fileB: outB.join('\r\n') + (outB.length ? '\r\n' : ''),
    fileBad: outBad.join('\r\n') + (outBad.length ? '\r\n' : ''),
    countA: outA.length,
    countB: outB.length
  };
}

/* ==== PARSE-CORE-END ==== */

/* ---------------- 以下为界面逻辑 ---------------- */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var input = $('input'), inputBox = $('inputBox'), fileEl = $('file');
  var last = null;

  var formatMeta = {
    account: {
      placeholder: '每行一条：邮箱----密码----2FA密钥----AT',
      hint: '账号模式会输出「邮箱----密码----2FA密钥」与 AT 两个文件。',
      fileAFormat: '邮箱----密码----2FA密钥',
      fileAContent: '邮箱-密码-2FA'
    },
    mailbox: {
      placeholder: '每行一条：完整邮箱凭证----AT',
      hint: '邮箱凭证模式会输出「完整邮箱凭证」与 AT 两个文件。',
      fileAFormat: '完整邮箱凭证',
      fileAContent: '邮箱凭证'
    }
  };

  function selectedFormat() {
    var checked = document.querySelector('input[name="format"]:checked');
    return checked && checked.value === 'mailbox' ? 'mailbox' : 'account';
  }

  function updateFormatUi() {
    var meta = formatMeta[selectedFormat()];
    input.placeholder = meta.placeholder;
    $('formatHint').textContent = meta.hint;
    $('fileAFormat').textContent = meta.fileAFormat;
    $('dl1').textContent = '下载 ' + meta.fileAContent + '.txt';
    $('formatAlert').hidden = true;
    $('resultCard').hidden = true;
    last = null;
  }

  function setStat() {
    var t = input.value;
    var n = t ? t.split(/\r\n|\r|\n/).filter(function (l) { return l.trim(); }).length : 0;
    $('inputStat').textContent = n ? ('共 ' + n + ' 行有效内容') : '0 行';
  }
  input.addEventListener('input', setStat);
  Array.prototype.forEach.call(document.querySelectorAll('input[name="format"]'), function (el) {
    el.addEventListener('change', updateFormatUi);
  });
  setStat();
  updateFormatUi();

  /* ---- 文件选择 / 拖拽 ---- */
  $('pick').addEventListener('click', function () { fileEl.click(); });
  fileEl.addEventListener('change', function () {
    if (fileEl.files && fileEl.files[0]) readFile(fileEl.files[0]);
    fileEl.value = '';
  });
  ['dragenter', 'dragover'].forEach(function (ev) {
    inputBox.addEventListener(ev, function (e) { e.preventDefault(); inputBox.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    inputBox.addEventListener(ev, function (e) { e.preventDefault(); inputBox.classList.remove('over'); });
  });
  inputBox.addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readFile(f);
  });

  function readFile(f) {
    var fr = new FileReader();
    fr.onload = function () { input.value = stripBom(String(fr.result)); setStat(); };
    fr.readAsText(f, 'utf-8');
  }

  /* ---- 清空 ---- */
  $('clear').addEventListener('click', function () {
    input.value = ''; setStat();
    $('formatAlert').hidden = true;
    $('resultCard').hidden = true; last = null;
  });

  /* ---- 解析 ---- */
  $('run').addEventListener('click', function () {
    var text = input.value;
    if (!text.trim()) { alert('请先粘贴或选择账号文本。'); return; }

    var res = splitAccounts(text, selectedFormat());
    var mismatch = res.formatMismatches[0];
    if (mismatch) {
      last = null;
      $('resultCard').hidden = true;
      var wanted = mismatch.expectedFormat === 'mailbox'
        ? '完整邮箱凭证----AT'
        : '邮箱----密码----2FA密钥----AT';
      $('formatAlertTitle').textContent = '格式选择错误';
      $('formatAlertText').textContent = '检测到输入内容应使用「' + wanted + '」格式。请重新选择该解析方式后，再点击“开始解析”。';
      $('formatAlert').hidden = false;
      $('formatAlert').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (!res.okCount) {
      last = null;
      $('resultCard').hidden = true;
      $('formatAlertTitle').textContent = '无法解析输入内容';
      $('formatAlertText').textContent = '未识别到任何支持的格式。请确认每条数据为「邮箱----密码----2FA密钥----AT」或「完整邮箱凭证----AT」后，再点击“开始解析”。';
      $('formatAlert').hidden = false;
      $('formatAlert').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    $('formatAlert').hidden = true;
    last = res;
    last.batchStamp = makeBatchStamp(new Date());

    $('mOk').textContent = res.okCount;
    $('mBad').textContent = res.badCount;
    $('c1').textContent = res.countA + ' 条';
    $('c2').textContent = res.countB + ' 条';
    $('badDownload').hidden = !res.badCount;
    $('cBad').textContent = res.badCount + ' 条';

    /* 问题行 */
    if (res.badCount) {
      $('issueBox').hidden = false;
      $('issueSummary').textContent = '无法解析的行（' + res.badCount + ' 条）';
      $('issues').innerHTML = res.issues.slice(0, 50).map(function (it) {
        return '<li>第 ' + it.lineNo + ' 行：' + esc(it.reason) + ' —— <code>' + esc(short(it.raw)) + '</code></li>';
      }).join('') + (res.badCount > 50 ? '<li>……仅显示前 50 条</li>' : '');
    } else {
      $('issueBox').hidden = true;
    }

    $('resultCard').hidden = false;
    $('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function short(s) {
    s = String(s);
    return s.length > 60 ? s.slice(0, 60) + '…' : s;
  }

  /* ---- 下载 / 复制 ---- */
  function pad2(value) { return String(value).padStart(2, '0'); }
  function makeBatchStamp(now) {
    return now.getFullYear()
      + pad2(now.getMonth() + 1)
      + pad2(now.getDate())
      + '_'
      + pad2(now.getHours())
      + pad2(now.getMinutes());
  }
  function resultFileName(content, count) {
    return last.batchStamp + '_' + count + '条_' + content + '.txt';
  }
  function download(name, text) {
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 800);
  }
  function ready() {
    if (!last || !last.okCount) { alert('还没有可下载的内容，请先完成解析。'); return false; }
    return true;
  }
  $('dl1').addEventListener('click', function () {
    if (ready()) download(resultFileName(formatMeta[last.format].fileAContent, last.countA), last.fileA);
  });
  $('dl2').addEventListener('click', function () {
    if (ready()) download(resultFileName('AT', last.countB), last.fileB);
  });
  $('dlBad').addEventListener('click', function () {
    if (last && last.badCount) download(resultFileName('解析失败原始行', last.badCount), last.fileBad);
  });

  function copy(btn, text) {
    var done = function () {
      var old = btn.textContent;
      btn.textContent = '已复制 ✓';
      setTimeout(function () { btn.textContent = old; }, 1400);
    };
    var fail = function () { alert('复制失败，请改用「下载」按钮。'); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fail);
    } else {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      } catch (e) { fail(); }
    }
  }
  $('cp1').addEventListener('click', function () { if (ready()) copy(this, last.fileA); });
  $('cp2').addEventListener('click', function () { if (ready()) copy(this, last.fileB); });
})();
</script>
</body>
</html>
